[pytest]
log_cli = 0
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)
log_cli_date_format=%Y-%m-%d %H:%M:%S
# addopts = --ignore tests/test_file_to_ignore.py
# The markers below are implemented as decorators on test functions, eg. @pytest.mark.slow
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
