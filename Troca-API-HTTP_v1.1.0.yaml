openapi: "3.0.3"
info:
  description: "Troca API Description"
  version: "1.1.0"
  title: "Troca"
  contact:
    name: "Hadrien Lafforgue"
    email: "hadrien.lafforgue@trialog.com"

tags:
  - name: "Configuration"
    description: "Connector and system configuration, and location association"
  - name: "Structure"
    description: "Data related to charging infrastructure"
  - name: "Session"
    description: "Data related to charging sessions"
  - name: "Grid"
    description: "Data related to grid connections and observation points"
  - name: "ESS"
    description: "Data related to storage systems as energy sources"
  - name: "Prosumer"
    description: "Data related to prosumer (renewable energy production) sites"
  - name: "Battery"
    description: "Data related to batteries used as energy sources"
  - name: "User"
    description: "Data linked to Troca users"
  - name: "Core"
    description: "Data linked to EMS core scheduling and commands"


paths:
  /structure/pools:
