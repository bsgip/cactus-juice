          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"
  /core/commands/compute-schedule:
    post:
      tags:
        - "Core"
      summary: "Compute Schedule"
      description: "Dispatches a schedule computation command to the registered core connector. The resulting behavior depends on the connector implementation in use."
      operationId: "handleComputeSchedule"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/ComputeScheduleRequest"
      responses:
        "200":
          description: "successful operation - returns the created command IDs"
          content:
            "application/json":
              schema:
                type: "array"
                items:
                  type: "string"
                  format: "uuid"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"

  /core/applied-charging-profiles:
    get:
      tags:
        - "Core"
      summary: "Get Applied Charging Profiles"
      operationId: "handleGetAppliedChargingProfile"
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Skip"
      responses:
        "200":
          description: "successful operation"
          content:
            "application/json":
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/AppliedChargingProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"
  /csv/core/applied-charging-profiles:
    get:
      tags:
        - "Core"
      summary: "Get Applied Charging Profiles (CSV)"
      operationId: "handleGetAppliedChargingProfileCsv"
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Skip"
      responses:
        "200":
          description: "successful operation"
          content:
            "text/csv":
              schema:
                type: "string"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"
  /observation-points/metering-data-forecast:
    get:
      tags:
        - "Grid"
      summary: "Get Metering Data Forecast"
      operationId: "handleGetMeteringDataForecast"
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Skip"
      responses:
        "200":
          description: "successful operation"
          content:
            "application/json":
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/MeteringDataForecast"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"
      deprecated: true
      description: "Deprecated. Use GET /grid-connections/dynamic-tariff."
  /grid-connections/forecast:
    post:
      tags:
        - "Grid"
      summary: "Set Metering Data Forecast"
      operationId: "handleSetMeteringDataForecast"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "array"
              items:
                $ref: "#/components/schemas/MeteringDataForecast"
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"
      deprecated: true
      description: "Deprecated. Use POST /grid-connections/dynamic-tariff."
components:
  responses:
    Success:
      description: "Success"
      content:
        "text/plain":
          schema:
            type: "string"
    BadRequest:
      description: "Bad request"
      content:
        "text/plain":
          schema:
            type: "string"
    Unauthorized:
      description: "Unauthorized access"
      content:
        "text/plain":
          schema:
            type: "string"
    Forbidden:
      description: "Forbidden"
      content:
        "text/plain":
          schema:
            type: "string"
    NotFound:
      description: "Not found"
      content:
        "text/plain":
          schema:
            type: "string"
    ServerError:
      description: "Internal server error"
      content:
        "text/plain":
          schema:
            type: "string"
  parameters:
    Limit:
      name: "limit"
      in: "query"
      description: "Limit for retrieved elements"
      required: false
      schema:
        type: "integer"
    Skip:
      name: "skip"
      in: "query"
      description: "Number of returned elements to skip"
      required: false
      schema:
        type: "integer"
  schemas:
    GeoLocation:
      type: "object"
      properties:
        latitude:
          type: "string"
        longitude:
          type: "string"

    GeoLocationWithName:
      type: "object"
      properties:
        latitude:
          type: "string"
        longitude:
          type: "string"
        name:
          type: "string"

        alternativeNames:
          type: "array"
          items:
            type: "string"
        customData:
          type: "object"
    Text:
      type: "object"
      properties:
        language:
          type: "string"
        text:
          type: "string"
    Token:
      type: "object"
      description: "EV user token."
      required:
        - "value"
        - "type"
      properties:
        value:
          type: "string"
          minLength: 1
        type:
          type: "string"
          enum:
            - "emaid"
            - "iso_14443"
            - "iso_15693"
            - "key_code"
            - "mac_address"
            - "central"
            - "local"
            - "no_authorization"
            - "iso7812"
            - "unknown"
        tokenIssuer:
          type: "string"
        expiryTime:
          type: "string"
          format: "date-time"
    ImageInfo:
      type: "object"
      properties:
        url:
          type: "string"
        thumbnail:
          type: "string"
        extension:
          type: "string"
        category:
          type: "string"
        width:
          type: "integer"
        height:
          type: "integer"
    ValuePerType:
      type: "object"
      properties:
        type:
          $ref: "#/components/schemas/ValueType"
        values:
          type: "number"
    AuthenticationMethod:
      type: string
      enum:
        - "remote start"
        - "real time demand"
        - "free for all"
        - "authorization list"
        - "local"
        - "unknown"
    SessionCommandType:
      type: "string"
      enum:
        - "set_charging_profile"
        - "start_new_transaction"
        - "stop_transaction"
        - "authorize"
        - "clear_charging_profile"
        - "unknown"
    SessionStatus:
      type: string
      enum:
        - "pending"
        - "charging"
        - "completed"
        - "invalid"
        - "cleared"
        - "unknown"
    CommandStatus:
      type: "string"
      enum:
        - "error"
        - "accepted"
        - "pending"
        - "refused"
        - "unknown"
    ValueType:
      type: "string"
      enum:
        - "Active power"
        - "Reactive power"
        - "Apparent power"
        - "Active Energy"
        - "Reactive Energy"
        - "Apparent Energy"
        - "Percentage"
        - "Ratio"
        - "Duration"
        - "Weight"
        - "Voltage"
        - "Price"
        - "Amperage"
        - "Temperature"
        - "Charge Quantity"
        - "No type"
      description: "Value type, as a string."
    LocationId:
      type: "object"
      description: "Identifies one element of the structure hierarchy (pool/station/EVSE/connector) at a given level. Level values are lowerCamelCase (see StructureLevel)."
      required:
        - "locationId"
        - "level"
      properties:
        locationId:
          type: "string"
          format: "uuid"
          description: "UUID of the pool, station, EVSE or connector, depending on level."
        level:
          $ref: "#/components/schemas/StructureLevel"
    PoolData:
      type: "object"
      required:
        - "poolId"
        - "name"
        - "type"
        - "coordinates"
        - "issuerId"
        - "lastUpdated"
        - "createdAt"
      properties:
        poolId:
          type: "string"
          format: "uuid"
        name:
          type: "string"
          minLength: 1
        alternativeNames:
          type: "array"
          items:
            type: "string"
        customData:
          type: "object"
        type:
          type: "string"
        address:
          type: "string"
        city:
          type: "string"
        postalCode:
          type: "string"
        country:
          type: "string"
        areaCode:
          type: "string"
        coordinates:
          $ref: "#/components/schemas/GeoLocation"
        otherLocations:
          type: "array"
          items:
            $ref: "#/components/schemas/GeoLocationWithName"
        directions:
          type: "array"
          items:
            $ref: "#/components/schemas/Text"
        timeZone:
          type: "string"
        issuerId:
          type: "string"
          format: "uuid"
          readOnly: true
        lastUpdated:
          type: "string"
          format: "date-time"
          readOnly: true
        createdAt:
          type: "string"
          format: "date-time"

          readOnly: true
    ChargingStationData:
      type: "object"
      required:
        - "stationId"
        - "name"
        - "model"
        - "vendorId"
        - "issuerId"
        - "lastUpdated"
        - "createdAt"
      properties:
        stationId:
          type: "string"
          format: "uuid"
        name:
          type: "string"
          minLength: 1
        alternativeNames:
          type: "array"
          items:
            type: "string"
        customData:
          type: "object"
        multiplier:
          type: "number"
        mathFunction:
          type: "string"
          enum:
            - "exponential"
            - "linear"
            - "unknown"
        model:
          type: "string"
        vendorId:
          type: "string"
        issuerId:
          type: "string"
          format: "uuid"
          readOnly: true
        lastUpdated:
          type: "string"
          format: "date-time"
          readOnly: true
        createdAt:
          type: "string"
          format: "date-time"

          readOnly: true
    EvseUid:
      type: "object"
      description: "Identifies an EVSE by its parent station name plus its own EVSE number."
      required:
        - "stationName"
        - "evseNb"
      properties:
        stationName:
          type: "string"
          minLength: 1
        evseNb:
          type: "integer"

          minimum: 1
    EvseConnectorUid:
      type: "object"
      description: "Identifies an EVSE connector by its parent EVSE's uid plus its own connector number."
      required:
        - "stationName"
        - "evseNb"
        - "connectorNb"
      properties:
        stationName:
          type: "string"
          minLength: 1
        evseNb:
          type: "integer"
          minimum: 1
        connectorNb:
          type: "integer"

          minimum: 1
    EvseData:
      type: "object"
      required:
        - "evseId"
        - "name"
        - "evseUid"
        - "issuerId"
        - "lastUpdated"
        - "createdAt"
      properties:
        evseId:
          type: "string"
          format: "uuid"
        name:
          type: "string"
          minLength: 1
        alternativeNames:
          type: "array"
          items:
            type: "string"
        customData:
          type: "object"
        evseUid:
          $ref: "#/components/schemas/EvseUid"
        capability:
          type: "array"
          items:
            type: "string"
            enum:
              - "charging_profile_capability"
              - "credit_card_payable"
              - "remote_stop_start_capable"
              - "reservable"
              - "rfid_reader"
              - "unlock_capable"
              - "unknown"
        coordinates:
          $ref: "#/components/schemas/GeoLocation"
        reference:
          type: "string"
        directions:
          type: "array"
          items:
            $ref: "#/components/schemas/Text"
        issuerId:
          type: "string"
          format: "uuid"
          readOnly: true
        lastUpdated:
          type: "string"
          format: "date-time"
          readOnly: true
        createdAt:
          type: "string"
          format: "date-time"

          readOnly: true
    ElectricalConnectionCharacteristic:
      type: "object"
      description: "Electrical connection characteristics shared by connectors/observation points across modules."
      properties:
        nominalVoltage:
          $ref: "#/components/schemas/TEmsValue"
        powerFactor:
          $ref: "#/components/schemas/TEmsValue"
        isCapacitiveReceptor:
          type: "boolean"
        bidirectional:
          type: "boolean"
        powerType:
          $ref: "#/components/schemas/PowerType"
        amperage:
          $ref: "#/components/schemas/TEmsValue"

    EvseConnectorData:
      type: "object"
      required:
        - "evseConnectorId"
        - "name"
        - "evseConnectorUid"
        - "standard"
        - "format"
        - "issuerId"
        - "lastUpdated"
        - "createdAt"
      allOf:
        - $ref: "#/components/schemas/ElectricalConnectionCharacteristic"
        - type: "object"
          properties:
            evseConnectorId:
              type: "string"
              format: "uuid"
            name:
              type: "string"
            alternativeNames:
              type: "array"
              items:
                type: "string"
            customData:
              type: "object"
            evseConnectorUid:
              $ref: "#/components/schemas/EvseConnectorUid"
            standard:
              type: "string"
              enum:
                - "chademo"
                - "domestic_a"
                - "domestic_b"
                - "domestic_c"
                - "domestic_d"
                - "domestic_e"
                - "domestic_f"
                - "domestic_i"
                - "domestic_j"
                - "domestic_k"
                - "domestic_l"
                - "domestic_g"
                - "domestic_h"
                - "iec_62196_T1"
                - "iec_62196_T2"
                - "iec_62196_T3A"
                - "iec_62196_T3C"
                - "iec_62196_T1_COMBO"
                - "iec_62196_T2_COMBO"
                - "iec_60309_2_three_16"
                - "iec_60309_2_three_32"
                - "iec_60309_2_three_64"
                - "iec_60309_2_single_16"
                - "tesla_r"
                - "tesla_s"
                - "unknown"
            format:
              type: "string"
              enum:
                - "cable"
                - "socket"
                - "unknown"
            terms:
              type: "string"
              format: "uri"
            issuerId:
              type: "string"
              format: "uuid"
              readOnly: true
            lastUpdated:
              type: "string"
              format: "date-time"
              readOnly: true
            createdAt:
              type: "string"
              format: "date-time"

              readOnly: true
    LocationPairAssociation:
      type: "object"
      description: "Pairs a structure location with a lower-level one it contains."
      required:
        - "highLevelStructure"
        - "lowLevelStructure"
        - "issuerId"
        - "lastUpdated"
        - "createdAt"
      properties:
        highLevelStructure:
          $ref: "#/components/schemas/LocationId"
        lowLevelStructure:
          $ref: "#/components/schemas/LocationId"
        issuerId:
          type: "string"
          format: "uuid"
          readOnly: true
        lastUpdated:
          type: "string"
          format: "date-time"
          readOnly: true
        createdAt:
          type: "string"
          format: "date-time"

          readOnly: true
    TimeInterval:
      type: "object"
      required:
        - "minTime"
        - "maxTime"
      properties:
        minTime:
          type: "string"
          format: "time"
        maxTime:
          type: "string"
          format: "time"

    LocationDefaultInputScheduleConstraint:
      type: "object"
      description: "Default input schedule constraint for a location."
      required:
        - "locationId"
        - "issuerId"
        - "lastUpdated"
        - "createdAt"
        - "startTime"
        - "endTime"
      properties:
        locationId:
          $ref: "#/components/schemas/LocationId"
        customData:
          type: "object"
        startTime:
          type: "string"
          format: "date-time"
        endTime:
          type: "string"
          format: "date-time"
        global:
          allOf:
            - $ref: "#/components/schemas/Bounds"
          description: "All-phase bounds."
        l1:
          allOf:
            - $ref: "#/components/schemas/Bounds"
          description: "Phase L1 bounds."
        l2:
          allOf:
            - $ref: "#/components/schemas/Bounds"
          description: "Phase L2 bounds."
        l3:
          allOf:
            - $ref: "#/components/schemas/Bounds"
          description: "Phase L3 bounds."
        recurrency:
          type: "boolean"
        kind:
          $ref: "#/components/schemas/InputKind"
        inputType:
          $ref: "#/components/schemas/InputType"
        context:
          $ref: "#/components/schemas/ChargeConstraintContext"
        issuerId:
          type: "string"
          format: "uuid"
          readOnly: true
        lastUpdated:
          type: "string"
          format: "date-time"
          readOnly: true
        createdAt:
          type: "string"
          format: "date-time"

          readOnly: true
    LocationOutOfBusinessInputScheduleConstraint:
      type: "object"
      description: "Input schedule constraint applied while the location is out of business."
      allOf:
        - $ref: "#/components/schemas/LocationDefaultInputScheduleConstraint"

    StructureCommandData:
      type: "object"
      description: "Structure command. The type field selects the command (unlockConnector, reserveEquipment, resetEquipment, updateEquipmentFirmware, changeEquipmentAvailability, getEquipmentLogs, changeConfiguration, getConfiguration)."
      required:
        - "commandId"
        - "type"
        - "issuerId"
        - "lastUpdated"
        - "createdAt"
      properties:
        commandId:
          type: "string"
          format: "uuid"
        customData:
          type: "object"
        type:
          type: "string"
          enum:
            - "unknown"
            - "change_availability"
            - "get_logs"
            - "reserve"
            - "update_firmware"
            - "reset"
            - "connection_request"
            - "unlock_connector"
            - "change_configuration"
            - "get_configuration"
        inputParameters:
          allOf:
            - $ref: "#/components/schemas/CommandParameter"
          description: "inputParameters.parameters keys required per type: change_availability -> status (active|inactive); get_logs -> url, otherInfo; reserve -> tokenId, expiryTime; update_firmware -> url, retrieveDate, otherInfo; reset -> type (immediate|on idle). The targeted locations/connectors are optional and default to every location the caller is allowed to access."
        responseParameters:
          type: "array"
          items:
            $ref: "#/components/schemas/CommandParameter"
        issuerId:
          type: "string"
          format: "uuid"
          readOnly: true
        lastUpdated:
          type: "string"
          format: "date-time"
          readOnly: true
        createdAt:
          type: "string"
          format: "date-time"

          readOnly: true
    CommandStatusAssociation:
      type: "object"
      description: "Timestamped status of a command."
      required:
        - "commandId"
        - "status"
        - "timestamp"
        - "issuerId"
        - "lastUpdated"
        - "createdAt"
      properties:
        commandId:
          type: "string"
          format: "uuid"
        status:
          $ref: "#/components/schemas/CommandStatus"
        timestamp:
          type: "string"
          format: "date-time"
        issuerId:
          type: "string"
          format: "uuid"
          readOnly: true
        lastUpdated:
          type: "string"
          format: "date-time"
          readOnly: true
        createdAt:
          type: "string"
          format: "date-time"

          readOnly: true
    CommandLocationAssociation:
      type: "object"
      description: "Location a command applies to."
      required:
        - "commandId"
        - "locationId"
        - "issuerId"
        - "lastUpdated"
        - "createdAt"
      properties:
        commandId:
          type: "string"
          format: "uuid"
        locationId:
          $ref: "#/components/schemas/LocationId"
        issuerId:
          type: "string"
          format: "uuid"
          readOnly: true
        lastUpdated:
          type: "string"
          format: "date-time"
          readOnly: true
        createdAt:
          type: "string"
          format: "date-time"

          readOnly: true
    LocationEnergyManagementModeSetting:
      type: "object"
      description: "Feature toggles and business hours of a location."
      required:
        - "locationId"
        - "isBoostModeEnabled"
        - "isDynamicTariffEnabled"
        - "isResEnabled"
        - "isEssEnabled"
        - "isV2GEnabled"
        - "isFlexEnabled"
        - "issuerId"
        - "lastUpdated"
        - "createdAt"
      properties:
        locationId:
          $ref: "#/components/schemas/LocationId"
        customData:
          type: "object"
        isBoostModeEnabled:
          type: "boolean"
        isDynamicTariffEnabled:
          type: "boolean"
        isResEnabled:
          type: "boolean"
        isEssEnabled:
          type: "boolean"
        isV2GEnabled:
          type: "boolean"
        isFlexEnabled:
          type: "boolean"
        businessHours:
          type: "object"
          description: "Map of weekday index (0-6) to a TimeInterval."
          additionalProperties:
            $ref: "#/components/schemas/TimeInterval"
        issuerId:
          type: "string"
          format: "uuid"
          readOnly: true
        lastUpdated:
          type: "string"
          format: "date-time"
          readOnly: true
        createdAt:
          type: "string"
          format: "date-time"

          readOnly: true
    AuthenticationSetting:
      type: "object"
      description: "Authorization type setting (free-for-all vs. whitelist-based authorization)."
      required:
        - "authType"
      properties:
        authType:
          type: "string"
          enum:
            - "free_for_all"
            - "whitelist"
            - "unknown"
        customData:
          type: "object"

    LocationDefaultEvUserAuthenticationSetting:
      type: "object"
      required:
        - "locationId"
        - "authType"
        - "issuerId"
        - "lastUpdated"
        - "createdAt"
      allOf:
        - $ref: "#/components/schemas/AuthenticationSetting"
        - type: "object"
          properties:
            locationId:
              $ref: "#/components/schemas/LocationId"
            issuerId:
              type: "string"
              format: "uuid"
              readOnly: true
            lastUpdated:
              type: "string"
              format: "date-time"
              readOnly: true
            createdAt:
              type: "string"
              format: "date-time"

              readOnly: true
    LocationOutOfBusinessEvUserAuthenticationSetting:
      type: "object"
      description: "EV user authentication setting applied while the location is out of business."
      allOf:
        - $ref: "#/components/schemas/LocationDefaultEvUserAuthenticationSetting"

    PoolDefaultEquipmentConnectionSetting:
      type: "object"
      required:
        - "poolId"
        - "authType"
        - "issuerId"
        - "lastUpdated"
        - "createdAt"
      allOf:
        - $ref: "#/components/schemas/AuthenticationSetting"
        - type: "object"
          properties:
            poolId:
              type: "string"
              format: "uuid"
            issuerId:
              type: "string"
              format: "uuid"
              readOnly: true
            lastUpdated:
              type: "string"
              format: "date-time"
              readOnly: true
            createdAt:
              type: "string"
              format: "date-time"

              readOnly: true
    PoolOutOfBusinessEquipmentConnectionSetting:
      type: "object"
      description: "Equipment connection setting applied while the pool is out of business."
      allOf:
        - $ref: "#/components/schemas/PoolDefaultEquipmentConnectionSetting"

