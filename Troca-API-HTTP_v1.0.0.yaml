openapi: "3.0.3"
info:
  description: "Troca API Description"
  version: "1.0.0"
  title: "Troca"
  contact:
    name : "Hadrien Lafforgue"
    email: "hadrien.lafforgue@trialog.com"

tags:
- name: "Log"
  description: "Server log file access"
- name: "Configuration"
  description: "Connector configuration and location association"
- name: "Structure"
  description: "Data related to charging infrastructure"
- name: "Session"
  description: "Data related to charging sessions"
- name: "Grid"
  description: "Data related to grid connections and observation points"
- name: "ESS"
  description: "Data related to storage systems as energy sources"
- name: "Prosumer"
  description: "Data related to prosumer (renewable energy production) sites"


paths:
  /log:
    get:
      tags:
      - "Log"
      summary: "Get Troca logs"
      description: "Get Troca logs"
      operationId: "getTEmsLog"
      responses:
        "200":
          description: "Success"
          content :
            "application/json":
              schema:
                type : string
        "401":
          description: "Unauthorized access"
          content :
            "text/plain":
              schema:
                type: "string"
        "403":
          description: "Forbidden"
          content :
            "text/plain":
              schema:
                type: "string"
        "404":
          description: "Not found"  
          content:
            "text/plain":
              schema:
                type : "string"
        "500":
          description: "Internal server error"
          content :
            "text/plain":
              schema:
                type: "string"
  /config/connectors:
    get:
      tags:
        - "Configuration"
      summary: "GET connector data list"
      description: "GET connector data list."
      operationId: "getConnectorDataList"
      parameters:
        - name: "connector.connectorId"
          in: query
          description: "Troca connector ID"
          required: false
          explode : false
          schema:
            type: "array"
            items:
              type: "string"
        - name: "connector.name"
          in: "query"
          description: "Connector name"
          required: false
          explode : false
          schema:
            type: "array"
            items:
              type : "string"
        - name : connector.type
          in : query
          description : "Connector type"
          required : false
          explode : false
          schema:
            type : "array"
            items:
                $ref: '#/components/schemas/ConnectorType'
        - name : connector.enablingModules
          in : query
          description : "Module enabled by the connector"
          required : false
          explode : false
          schema:
            type : "array"
            items:
                $ref: "#/components/schemas/ModuleType"
        - name : connector.listeningModules 
          in : query
          description : "Module used by the connector"
          required : false
          explode : false
          schema:
            type : "array"
            items:
                $ref: "#/components/schemas/ModuleType"
        - name : location.locationId 
          in : query
          description : "Id of the structure location"
          required : false
          explode : false
          schema:
            type : "array"
            items:
                type : "string"
        - name : location.level 
          in : query
          description : "Targeted structure level"
          required : false
          explode : false
          schema:
            type : "array"
            items:
                $ref: '#/components/schemas/StructureLevel'
        - name : limit 
          in : query
          description : "Limit for retrieved elements"
          required : false
          explode : false
          schema:
                type : "integer"
        - name : skip 
          in : query
          description : "Number of returned elements to skip"
          required : false
          explode : false
          schema:
            type : "integer"
      responses:
        "200":
          description: "Success"
          content :
            "application/json":
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/ConnectorData"
        "401":
          description: "Unauthorized access"
          content :
            "text/plain":
              schema:
                type: "string"
        "403":
          description: "Forbidden"
          content :
            "text/plain":
              schema:
                type: "string" 
        "500":
          description: "Internal server error"
          content :
            "text/plain":
              schema:
                type: "string"
