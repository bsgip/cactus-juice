    post:
      tags:
      - "Configuration"
      summary: "POST connector location configuration list"
      description: "POST connector location configuration list. Only admin users with no location restrictions can do it."
      operationId: "postConnectorLocation"
      requestBody:
        required : true
        content: 
         "application/json":
            schema:
              type: "array"
              items:
                $ref: "#/components/schemas/ConnectorLocation"
                
      responses:
        "200":
          description: "Success"
          content :
            "text/plain":
              schema:
                type: "string"
        "400":
          description: "Bad request"
          content :
            "text/plain":
              schema:
                type: "string"
        "401":
          description: "Unauthorized access"
          content :
            "text/plain":
              schema:
                type: "string"
        "403":
          description: "Forbidden"
          content :
            "text/plain":
              schema:
                type: "string"    
        "500":
          description: "Internal server error"
          content :
            "text/plain":
              schema:
                type: "string"
    delete:
      tags:
      - "Configuration"
      summary: "Delete connector location association"
      description: ""
      operationId: "deleteConnectorLocation"
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Skip"
      responses:
