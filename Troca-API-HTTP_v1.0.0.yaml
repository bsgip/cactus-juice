        type : "string"
        enum :
            - core
            - flex
            - grid
            - user
            - session
            - structure
            - res 
            - ess 
            - ext-ems 
            - emsp
    ConnectorType : 
        type : "string"
        enum :
            - xEmsConnector
            - EmsConnector
            - QOcppConnector
            - LinkyConnector
    StructureLevel :
        type : "string"
        enum :
            - evse
            - pool
            - station
            - all 
    ConnectorData:
        type : "object"
        required : 
            - connectorId
        properties:
            connectorId :
                type : "string"
            name :
                type : "string"
            type :
                $ref: '#/components/schemas/ConnectorType'
            enablingModules :
                type : "array"
                items:
                    $ref: "#/components/schemas/ModuleType"
            listeningModules :
                type : "array"
                items:
                    $ref: "#/components/schemas/ModuleType"
            createdAt:
                type : "string"
                format : "date-time"
            lastUpdated:
                type : "string"
                format : "date-time"
    ConnectorLocation:
        type : "object"
        required : 
            - connectorId
        properties:
            connectorId :
                type : "string"
            poolIdList :
                type : "array"
                items:
                    type : "string"
            stationIdList :
                type : "array"
                items:
                    type : "string"
            evseIdList :
                type : "array"
                items:
                    type: "string"
