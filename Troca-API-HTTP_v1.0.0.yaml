      type : "string"
      enum : 
        - Active power
        - Reactive power
        - Apparent power
        - Energy
        - Percentage
        - Ratio
        - Duration 
        
    ValuePerType:
      type : "object"
      properties:
        type : 
          $ref: "#/components/schemas/ValueType"
        values:
          type : "number"
            
    CommandStatus:
        type: "string"
        enum : 
            - pending
            - accepted
            - refused 
            - error
            - unknown
          
  
  
